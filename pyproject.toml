[project]
name = "contract-extractor"
version = "0.1.0"
description = "Structured data extraction from Brazilian contracts with Gemini"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
